# Firebase App Hosting configuration.
# Fill in the four NEXT_PUBLIC_FIREBASE_* values from Firebase console:
# Project settings -> Your apps -> Web app -> Config. They are public, not secrets.
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 2

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: ""
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: ""
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: ""
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: ""
    availability: [BUILD, RUNTIME]

  # Secret. Create it with:  firebase apphosting:secrets:set ANTHROPIC_API_KEY
  # Remove this block if you do not use the live AI assistant.
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
    availability: [RUNTIME]
